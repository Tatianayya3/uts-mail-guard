# Prometheus: recolecta las métricas de los 3 microservicios levantados con
# docker compose (red interna). Ver docs/DEVOPS.md → Monitor.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: mail-guard-local
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:4000
          - analysis-service:4001
          - history-service:4002
        labels:
          env: local

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
